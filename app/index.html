<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책숨 서재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 한 줄 상단 탭 + 720px 단일 컬럼. 책등(spine) 리본 하나만 강조색으로 쓴다. */
:root {
  --bg: #eef1f3;
  --paper: #ffffff;
  --ink: #18232b;
  --muted: #5b6a73;
  --line: #d5dde1;
  --pine: #2e5c4f;
  --pine-soft: #dbe8e3;
  --brass: #a8841f;
  --heat-0: #e3e9ec;
  --heat-1: #b9d3c9;
  --heat-2: #7fae9c;
  --heat-3: #44806b;
  --heat-4: #2e5c4f;
  --danger: #a3402e;
  --display: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181d; --paper: #18222a; --ink: #e4ebee; --muted: #93a3ac; --line: #2b3943;
    --pine: #7cc3aa; --pine-soft: #1f3530; --brass: #d8b44f;
    --heat-0: #1e2a32; --heat-1: #24473d; --heat-2: #33695a; --heat-3: #4f977f; --heat-4: #7cc3aa;
    --danger: #e08b78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181d; --paper: #18222a; --ink: #e4ebee; --muted: #93a3ac; --line: #2b3943;
  --pine: #7cc3aa; --pine-soft: #1f3530; --brass: #d8b44f;
  --heat-0: #1e2a32; --heat-1: #24473d; --heat-2: #33695a; --heat-3: #4f977f; --heat-4: #7cc3aa;
  --danger: #e08b78; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
.label { font: 500 .72rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 6px; }
.brand h1 { font-size: 1.5rem; letter-spacing: -.01em; }
.brand .label { white-space: nowrap; }
.brand h1 span { color: var(--pine); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { flex: 1 0 auto; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px 10px; font: 500 .95rem var(--body); color: var(--muted); cursor: pointer; }
nav.tabs button small { display: block; font: .66rem var(--mono); letter-spacing: .06em; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pine); }

main section { display: grid; gap: 20px; padding-top: 22px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; }
.stat b { font: 500 1.6rem/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--heat-0); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pine); }

button.btn, .btn { font: 500 .9rem var(--body); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.btn.primary { background: var(--pine); border-color: var(--pine); color: var(--paper); }
.btn.ghost { background: none; }
.btn.danger { color: var(--danger); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, nav.tabs button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
input, textarea, select { width: 100%; font: .95rem/1.5 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { min-height: 76px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }

/* 독서 세션 */
.timer { font: 500 2.6rem/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.live { color: var(--pine); }

/* 지식 적립 히트맵 */
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; width: max-content; }
.heat span { width: 13px; height: 13px; border-radius: 3px; background: var(--heat-0); }
.heat span[data-l="1"] { background: var(--heat-1); }
.heat span[data-l="2"] { background: var(--heat-2); }
.heat span[data-l="3"] { background: var(--heat-3); }
.heat span[data-l="4"] { background: var(--heat-4); }

/* 책 카드: 왼쪽 책등 리본 */
.book { display: grid; grid-template-columns: 6px 1fr; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 14px 0; overflow: hidden; }
.book .spine { background: var(--line); border-radius: 0 3px 3px 0; }
.book[data-s="reading"] .spine { background: var(--pine); }
.book[data-s="done"] .spine { background: var(--brass); }
.book .body { display: grid; gap: 8px; min-width: 0; }
.chip { display: inline-block; font: 500 .72rem/1 var(--mono); padding: 4px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.reading { color: var(--pine); border-color: var(--pine); }
.chip.done { color: var(--brass); border-color: var(--brass); }
.chip.ex { border-style: dashed; }

.quote { font-family: var(--display); font-size: 1.12rem; line-height: 1.75; }
.quote::before { content: "“"; color: var(--brass); margin-right: 2px; }
.quote::after { content: "”"; color: var(--brass); margin-left: 2px; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.levels div { font: .72rem var(--mono); text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--heat-0); color: var(--muted); }
.levels div.on { background: var(--pine-soft); color: var(--pine); font-weight: 500; }
.layers { display: grid; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; }
.layers p { font-size: .9rem; }

/* 음미 호흡 */
.breath { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--pine); margin: 6px auto; display: grid; place-items: center; font: 500 1.1rem var(--mono); animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.82); } 50% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .breath { animation: none; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .9rem; }
details summary { cursor: pointer; color: var(--muted); }
.empty { color: var(--muted); font-size: .92rem; }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>책<span>숨</span> 서재</h1>
      <span class="label" id="today-label"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="spark" aria-selected="true">불씨<small>동기</small></button>
      <button role="tab" data-tab="shelf" aria-selected="false">서재<small>기록</small></button>
      <button role="tab" data-tab="think" aria-selected="false">사유<small>감상</small></button>
      <button role="tab" data-tab="savor" aria-selected="false">음미<small>회상</small></button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
const KEY = "chaeksum-v1";
const DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const ymd = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const today = () => ymd(Date.now());

function sample() {
  const t = Date.now();
  return {
    example: true,
    goal: 24,
    dailyMin: 20,
    session: null,
    log: Object.fromEntries(Array.from({ length: 40 }, (_, i) => [ymd(t - i * DAY), i % 6 === 4 ? 0 : 15 + ((i * 7) % 30)]).filter(([, m]) => m)),
    books: [
      { id: uid(), title: "돈의 심리학", author: "모건 하우절", pages: 400, current: 400, status: "done", why: "부의 크기보다 태도가 오래간다는 말을 확인하고 싶어서", added: t - 60 * DAY, finished: t - 20 * DAY, rating: 5,
        refl: { summary: "돈을 잘 다루는 건 지능보다 행동의 문제다.", concepts: ["복리는 시간을 먹고 자란다", "충분함을 아는 것", "살아남는 것이 먼저"], explain: "저금통에 매일 조금씩 넣으면 나중엔 저금통이 스스로 커지는 것처럼 보여. 중요한 건 저금통을 깨지 않는 거야.", apply: "선물 거래를 멈추고 DCA로 바꾼 결정이 바로 '살아남기'였다. 월 1회 원칙을 점검한다.", question: "충분함의 기준을 나이와 함께 어떻게 다시 정해야 할까?" },
        quotes: [{ id: uid(), text: "돈을 잘 다루는 것은 얼마나 똑똑한가와는 별 관계가 없고, 어떻게 행동하는가와 관계가 깊다.", page: 20, added: t - 30 * DAY, revisits: [{ date: t - 10 * DAY, note: "시장이 흔들릴 때 다시 읽을 문장." }] }] },
      { id: uid(), title: "원씽", author: "게리 켈러 · 제이 파파산", pages: 280, current: 118, status: "reading", why: "팀장 업무가 흩어질 때 단 하나에 집중하는 법을 찾고 싶어서", added: t - 9 * DAY, rating: 0,
        refl: { summary: "", concepts: ["", "", ""], explain: "", apply: "", question: "" },
        quotes: [{ id: uid(), text: "지금 내가 할 수 있는 단 하나의 일은 무엇인가?", page: 106, added: t - 2 * DAY, revisits: [] }] },
      { id: uid(), title: "사피엔스", author: "유발 하라리", pages: 636, current: 0, status: "want", why: "부건이에게 인류 이야기를 들려줄 수 있을 만큼 큰 그림을 갖고 싶어서", added: t - 3 * DAY, rating: 0,
        refl: { summary: "", concepts: ["", "", ""], explain: "", apply: "", question: "" }, quotes: [] }
    ]
  };
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { S = sample(); }
let tab = "spark", focusBook = null, savorId = null, breathEnd = 0;
try { tab = localStorage.getItem(KEY + ":tab") || "spark"; } catch {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
const book = id => S.books.find(b => b.id === id);

/* ---------- 계산 ---------- */
function streak() {
  let n = 0, d = Date.now();
  if (!S.log[ymd(d)]) d -= DAY;
  while (S.log[ymd(d)]) { n++; d -= DAY; }
  return n;
}
function yearDone() { const y = new Date().getFullYear(); return S.books.filter(b => b.status === "done" && new Date(b.finished).getFullYear() === y).length; }
function totalMin() { return Object.values(S.log).reduce((a, b) => a + b, 0); }
function understanding(b) {
  const r = b.refl;
  const checks = [r.summary, r.concepts.filter(Boolean).length >= 2, r.explain, r.apply, r.question || b.quotes.length];
  return checks.filter(Boolean).length;
}
const LEVELS = ["훑음", "파악", "설명", "연결", "체화"];
function savorPool() {
  const items = [];
  S.books.forEach(b => {
    b.quotes.forEach(q => items.push({ id: q.id, book: b, kind: "구절", text: q.text, ref: q }));
    if (b.refl.summary) items.push({ id: "s-" + b.id, book: b, kind: "한 문장 요약", text: b.refl.summary, ref: b.refl.sumRef || (b.refl.sumRef = { revisits: [], added: b.finished || b.added }) });
  });
  const last = it => it.ref.revisits.length ? it.ref.revisits[it.ref.revisits.length - 1].date : 0;
  return items.sort((a, b) => last(a) - last(b));
}

/* ---------- 화면 ---------- */
function render() {
  $("#today-label").textContent = new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#app").innerHTML = `<section>${({ spark, shelf, think, savor })[tab]()}</section>`;
}

function spark() {
  const reading = S.books.filter(b => b.status === "reading");
  const next = S.books.filter(b => b.status === "want");
  const todayMin = S.log[today()] || 0;
  const done = yearDone();
  const pool = savorPool();
  const q = pool.length ? pool[new Date().getDate() % pool.length] : null;
  const s = S.session;
  return `
  ${S.example ? `<div class="panel"><div class="row"><span class="chip ex">예시 데이터</span><p class="muted" style="flex:1;min-width:200px">책 세 권과 40일 기록은 화면 구성을 보여주는 예시입니다.</p><button class="btn" data-act="clear-example">예시 지우고 시작</button></div></div>` : ""}
  <div class="panel">
    <span class="label">오늘의 독서 적립</span>
    <div class="split">
      <div class="stat"><b>${todayMin}<small class="muted">/${S.dailyMin}분</small></b><span class="muted">오늘 적립</span></div>
      <div class="stat"><b>${streak()}일</b><span class="muted">연속 독서</span></div>
      <div class="stat"><b>${done}/${S.goal}권</b><span class="muted">${new Date().getFullYear()}년 목표</span></div>
    </div>
    <div class="bar" aria-label="오늘 목표 달성률"><i style="width:${Math.min(100, todayMin / S.dailyMin * 100)}%"></i></div>
    <p class="muted">비트코인을 적립식으로 모으듯, 생각도 매일 조금씩 모읍니다. 지금까지 누적 <span class="num">${Math.floor(totalMin() / 60)}시간 ${totalMin() % 60}분</span>.</p>
  </div>

  <div class="panel">
    <span class="label">독서 세션</span>
    ${s ? `<p>『${esc(book(s.bookId)?.title)}』 읽는 중</p><div class="timer live" id="timer">00:00</div>
      <div class="row"><button class="btn primary" data-act="stop">세션 마치기</button><button class="btn ghost" data-act="cancel">취소</button></div>`
      : reading.length ? `<div class="row"><select id="sess-book" style="flex:1;min-width:180px">${reading.map(b => `<option value="${b.id}">${esc(b.title)}</option>`).join("")}</select><button class="btn primary" data-act="start">펼치기</button></div>
      <p class="muted">타이머를 켜는 순간이 가장 어렵습니다. 딱 ${S.dailyMin}분만 약속합니다.</p>`
      : `<p class="empty">읽는 중인 책이 없습니다. 아래 '다음 책'에서 한 권을 펼쳐 보세요.</p>`}
  </div>

  ${q ? `<div class="panel"><span class="label">오늘 다시 만나는 문장</span><p class="quote">${esc(q.text)}</p><p class="muted">『${esc(q.book.title)}』 · ${esc(q.book.author)}</p></div>` : ""}

  <div class="panel">
    <div class="row" style="justify-content:space-between"><span class="label">최근 12주</span><span class="muted" style="font-size:.85rem">진할수록 오래 읽은 날</span></div>
    <div class="heat-wrap">${heatmap()}</div>
  </div>

  <div class="panel">
    <span class="label">다음 책 · 내가 이 책을 원했던 이유</span>
    ${next.length ? next.map(b => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px">
      <div style="min-width:0;flex:1"><h3>${esc(b.title)}</h3><p class="muted">${esc(b.why || "이유를 적어두면 펼칠 힘이 됩니다.")}</p></div>
      <button class="btn" data-act="open" data-id="${b.id}">지금 펼치기</button></div>`).join("")
      : `<p class="empty">읽고 싶은 책을 서재에 담아 두세요.</p>`}
  </div>`;
}

function heatmap() {
  const end = new Date(); const start = new Date(end - (7 * 12 - 1 + end.getDay()) * DAY);
  let cells = "";
  for (let d = +start; d <= +end; d += DAY) {
    const m = S.log[ymd(d)] || 0;
    const l = m === 0 ? 0 : m < 10 ? 1 : m < 20 ? 2 : m < 40 ? 3 : 4;
    cells += `<span data-l="${l}" title="${ymd(d)} · ${m}분"></span>`;
  }
  return `<div class="heat">${cells}</div>`;
}

function shelf() {
  const order = { reading: 0, want: 1, done: 2 };
  const list = [...S.books].sort((a, b) => order[a.status] - order[b.status] || b.added - a.added);
  return `
  <details class="panel" ${S.books.length ? "" : "open"}>
    <summary><b>책 담기</b></summary>
    <form id="add-form" style="display:grid;gap:10px;margin-top:10px">
      <div class="split"><label class="field">제목<input id="f-title" required></label><label class="field">저자<input id="f-author"></label></div>
      <div class="split"><label class="field">전체 쪽수<input id="f-pages" type="number" min="1" inputmode="numeric"></label>
        <label class="field">상태<select id="f-status"><option value="want">읽고 싶은</option><option value="reading">읽는 중</option><option value="done">완독</option></select></label></div>
      <label class="field">이 책을 읽고 싶은 이유<textarea id="f-why" placeholder="미래의 내가 이 책을 펼치게 만들 한 줄"></textarea></label>
      <button class="btn primary">서재에 담기</button>
    </form>
  </details>
  <details class="panel"><summary><b>목표 설정</b></summary>
    <div class="split" style="margin-top:10px"><label class="field">올해 완독 목표(권)<input id="g-year" type="number" min="1" value="${S.goal}"></label><label class="field">하루 적립 목표(분)<input id="g-day" type="number" min="5" value="${S.dailyMin}"></label></div>
    <button class="btn" data-act="goal">목표 저장</button>
  </details>
  ${list.length ? list.map(bookCard).join("") : `<p class="empty">서재가 비어 있습니다. 첫 책을 담아 보세요.</p>`}
  <details class="panel"><summary><b>백업과 복원</b></summary>
    <p class="muted" style="margin-top:8px">기록은 이 브라우저에만 저장됩니다. 가끔 백업 문자열을 복사해 메모장에 보관하세요.</p>
    <div class="row"><button class="btn" data-act="export">백업 복사</button></div>
    <textarea id="import-box" placeholder="백업 문자열을 붙여넣고 복원을 누르세요"></textarea>
    <div class="row"><button class="btn" data-act="import">복원</button></div>
  </details>`;
}

function bookCard(b) {
  const pct = b.pages ? Math.round(b.current / b.pages * 100) : 0;
  const st = { want: "읽고 싶은", reading: "읽는 중", done: "완독" }[b.status];
  return `<article class="book" data-s="${b.status}"><div class="spine"></div><div class="body">
    <div class="row" style="justify-content:space-between"><h3 style="min-width:0">${esc(b.title)}</h3><span class="chip ${b.status}">${st}</span></div>
    <p class="muted">${esc(b.author)}${b.status === "done" ? ` · 이해도 ${LEVELS[Math.max(0, understanding(b) - 1)]}${b.rating ? " · " + "★".repeat(b.rating) : ""}` : ""}</p>
    ${b.status === "reading" ? `<div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row"><input type="number" id="pg-${b.id}" value="${b.current}" min="0" max="${b.pages || ""}" style="width:110px" aria-label="현재 쪽"><span class="muted num">/ ${b.pages || "?"}쪽 · ${pct}%</span><button class="btn" data-act="page" data-id="${b.id}">쪽 갱신</button></div>` : ""}
    ${b.why && b.status !== "done" ? `<p style="font-size:.9rem">${esc(b.why)}</p>` : ""}
    <div class="row">
      ${b.status === "want" ? `<button class="btn" data-act="open" data-id="${b.id}">읽기 시작</button>` : ""}
      ${b.status === "reading" ? `<button class="btn" data-act="finish" data-id="${b.id}">완독</button>` : ""}
      ${b.status !== "want" ? `<button class="btn primary" data-act="think" data-id="${b.id}">감상 쓰기</button>` : ""}
      <button class="btn ghost danger" data-act="del" data-id="${b.id}">삭제</button>
    </div>
    <div id="confirm-${b.id}" hidden class="row"><span class="muted">기록까지 모두 지워집니다.</span><button class="btn danger" data-act="del-yes" data-id="${b.id}">삭제 확인</button></div>
  </div></article>`;
}

function think() {
  const cands = S.books.filter(b => b.status !== "want");
  if (!cands.length) return `<p class="empty">읽는 중이거나 완독한 책이 생기면 감상을 쓸 수 있습니다.</p>`;
  const b = book(focusBook) || cands[0]; focusBook = b.id;
  const r = b.refl, u = understanding(b);
  return `
  <div class="panel">
    <label class="field">감상할 책<select id="think-book">${cands.map(x => `<option value="${x.id}" ${x.id === b.id ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select></label>
    <span class="label">이해의 깊이</span>
    <div class="levels">${LEVELS.map((l, i) => `<div class="${i < u ? "on" : ""}">${l}</div>`).join("")}</div>
    <p class="muted" style="font-size:.88rem">다섯 질문에 답할수록 한 칸씩 깊어집니다. 쓰는 만큼 이해합니다.</p>
  </div>
  <form class="panel" id="refl-form">
    <label class="field"><span><b style="color:var(--ink)">1. 한 문장으로</b> 이 책은 결국 무엇을 말하는가?</span><input id="r-summary" value="${esc(r.summary)}"></label>
    <div class="field"><span><b style="color:var(--ink)">2. 핵심 개념 세 가지</b></span>
      ${[0, 1, 2].map(i => `<input id="r-c${i}" value="${esc(r.concepts[i])}" aria-label="핵심 개념 ${i + 1}">`).join("")}</div>
    <label class="field"><span><b style="color:var(--ink)">3. 부건이에게 설명하기</b> 아홉 살이 알아듣게 풀어 쓰면, 내가 진짜 아는 것만 남습니다.</span><textarea id="r-explain">${esc(r.explain)}</textarea></label>
    <label class="field"><span><b style="color:var(--ink)">4. 내 삶에 연결</b> 일(조직·현장)이나 투자 원칙에서 무엇을 바꿀 것인가?</span><textarea id="r-apply">${esc(r.apply)}</textarea></label>
    <label class="field"><span><b style="color:var(--ink)">5. 저자에게 묻고 싶은 것</b></span><input id="r-question" value="${esc(r.question)}"></label>
    <label class="field">별점<select id="r-rating">${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}" ${b.rating === n ? "selected" : ""}>${n ? "★".repeat(n) : "아직"}</option>`).join("")}</select></label>
    <button class="btn primary">감상 저장</button>
  </form>
  <div class="panel">
    <span class="label">마음에 남은 구절</span>
    ${b.quotes.map(q => `<div style="border-top:1px solid var(--line);padding-top:10px"><p class="quote">${esc(q.text)}</p><p class="muted num" style="font-size:.85rem">${q.page ? q.page + "쪽 · " : ""}음미 ${q.revisits.length}회</p></div>`).join("") || `<p class="empty">아직 담은 구절이 없습니다.</p>`}
    <form id="quote-form" style="display:grid;gap:8px">
      <textarea id="q-text" placeholder="밑줄 그은 문장을 옮겨 적으세요" required></textarea>
      <div class="row"><input id="q-page" type="number" placeholder="쪽" style="width:100px" aria-label="쪽"><button class="btn">구절 담기</button></div>
    </form>
  </div>`;
}

function savor() {
  const pool = savorPool();
  if (!pool.length) return `<p class="empty">구절이나 한 문장 요약을 남기면, 이곳에서 시간을 두고 다시 만납니다.</p>`;
  const it = pool.find(p => p.id === savorId) || pool[0]; savorId = it.id;
  const days = Math.max(0, Math.round((Date.now() - (it.ref.added || it.book.added)) / DAY));
  const breathing = breathEnd > Date.now();
  return `
  <div class="panel">
    <div class="row" style="justify-content:space-between"><span class="label">${it.kind} · ${days}일 전에 남김</span><span class="chip">음미 ${it.ref.revisits.length}회</span></div>
    <p class="quote">${esc(it.text)}</p>
    <p class="muted">『${esc(it.book.title)}』 · ${esc(it.book.author)}</p>
    ${breathing ? `<div class="breath" id="breath">3:00</div><p class="muted" style="text-align:center">문장을 소리 내어 한 번, 속으로 한 번 읽습니다. 숨을 고르며 떠오르는 장면을 기다립니다.</p>`
      : `<div class="row"><button class="btn" data-act="breathe">3분 머무르기</button><button class="btn ghost" data-act="skip">다른 문장</button></div>`}
  </div>
  <form class="panel" id="savor-form">
    <label class="field"><span><b style="color:var(--ink)">지금의 나에게 이 문장은 무엇을 말하는가?</b> 처음 읽었을 때와 달라진 점을 적어 두면, 생각이 겹겹이 쌓입니다.</span><textarea id="s-note" required></textarea></label>
    <button class="btn primary">음미 기록</button>
  </form>
  ${it.ref.revisits.length ? `<div class="panel"><span class="label">쌓인 생각의 층</span><div class="layers">${[...it.ref.revisits].reverse().map(r => `<div><p class="label">${ymd(r.date)}</p><p>${esc(r.note)}</p></div>`).join("")}</div></div>` : ""}
  <p class="muted" style="font-size:.85rem">가장 오래 다시 보지 않은 문장부터 꺼냅니다. 간격을 두고 다시 만날수록 오래 기억됩니다.</p>`;
}

/* ---------- 동작 ---------- */
function addMinutes(min) { if (min > 0) S.log[today()] = (S.log[today()] || 0) + min; }
const actions = {
  "clear-example": () => { S = { example: false, goal: S.goal, dailyMin: S.dailyMin, session: null, log: {}, books: [] }; tab = "shelf"; toast("빈 서재로 시작합니다"); },
  start: () => { S.session = { bookId: $("#sess-book").value, start: Date.now() }; },
  stop: () => { const m = Math.round((Date.now() - S.session.start) / 6e4); addMinutes(m); S.session = null; toast(m ? `${m}분 적립했습니다` : "1분 미만은 적립되지 않습니다"); },
  cancel: () => { S.session = null; },
  open: id => { const b = book(id); b.status = "reading"; S.session = { bookId: id, start: Date.now() }; tab = "spark"; toast(`『${b.title}』 세션 시작`); },
  page: id => { const b = book(id); const v = +$("#pg-" + id).value; b.current = Math.max(0, b.pages ? Math.min(b.pages, v) : v); toast(`${b.current}쪽까지 기록`); },
  finish: id => { const b = book(id); b.status = "done"; b.current = b.pages || b.current; b.finished = Date.now(); focusBook = id; tab = "think"; toast("완독! 기억이 선명할 때 감상을 남겨 보세요"); },
  think: id => { focusBook = id; tab = "think"; },
  del: id => { $("#confirm-" + id).hidden = false; return true; },
  "del-yes": id => { S.books = S.books.filter(b => b.id !== id); if (S.session?.bookId === id) S.session = null; toast("삭제했습니다"); },
  goal: () => { S.goal = Math.max(1, +$("#g-year").value || 24); S.dailyMin = Math.max(5, +$("#g-day").value || 20); toast("목표를 저장했습니다"); },
  export: () => { const txt = JSON.stringify(S); navigator.clipboard?.writeText(txt).then(() => toast("백업을 복사했습니다"), () => { const box = $("#import-box"); box.value = txt; box.select(); toast("선택된 문자열을 직접 복사하세요"); }); return true; },
  import: () => { try { const d = JSON.parse($("#import-box").value); if (!Array.isArray(d.books)) throw 0; S = d; toast("복원했습니다"); } catch { toast("백업 문자열 형식이 맞지 않습니다"); return true; } },
  breathe: () => { breathEnd = Date.now() + 180e3; },
  skip: () => { const pool = savorPool(); const i = pool.findIndex(p => p.id === savorId); savorId = pool[(i + 1) % pool.length].id; breathEnd = 0; },
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; try { localStorage.setItem(KEY + ":tab", tab); } catch {} render(); scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  e.preventDefault();
  const keep = actions[a.dataset.act](a.dataset.id);
  save(); if (!keep) render();
});

document.addEventListener("change", e => {
  if (e.target.id === "think-book") { focusBook = e.target.value; render(); }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "add-form") {
    S.books.push({ id: uid(), title: $("#f-title").value.trim(), author: $("#f-author").value.trim(), pages: +$("#f-pages").value || 0, current: 0,
      status: $("#f-status").value, why: $("#f-why").value.trim(), added: Date.now(), finished: $("#f-status").value === "done" ? Date.now() : null, rating: 0,
      refl: { summary: "", concepts: ["", "", ""], explain: "", apply: "", question: "" }, quotes: [] });
    toast("서재에 담았습니다");
  }
  if (f.id === "refl-form") {
    const b = book(focusBook);
    Object.assign(b.refl, { summary: $("#r-summary").value.trim(), concepts: [0, 1, 2].map(i => $("#r-c" + i).value.trim()), explain: $("#r-explain").value.trim(), apply: $("#r-apply").value.trim(), question: $("#r-question").value.trim() });
    b.rating = +$("#r-rating").value;
    toast(`감상을 저장했습니다 · 이해도 ${LEVELS[Math.max(0, understanding(b) - 1)]}`);
  }
  if (f.id === "quote-form") {
    book(focusBook).quotes.push({ id: uid(), text: $("#q-text").value.trim(), page: +$("#q-page").value || 0, added: Date.now(), revisits: [] });
    toast("구절을 담았습니다");
  }
  if (f.id === "savor-form") {
    const it = savorPool().find(p => p.id === savorId);
    it.ref.revisits.push({ date: Date.now(), note: $("#s-note").value.trim() });
    breathEnd = 0;
    toast("생각의 층을 하나 더 쌓았습니다");
  }
  save(); render();
});

setInterval(() => {
  const el = $("#timer");
  if (el && S.session) { const s = Math.floor((Date.now() - S.session.start) / 1000); el.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
  const br = $("#breath");
  if (br) { const left = Math.max(0, Math.ceil((breathEnd - Date.now()) / 1000)); br.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; if (!left) { breathEnd = 0; render(); toast("3분이 지났습니다. 떠오른 생각을 적어 보세요"); } }
}, 1000);

render();
</script>
